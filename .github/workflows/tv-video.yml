# Grava um vídeo do app de Apple TV no simulador (a Apple pediu uma gravação de tela da assinatura com os links de
# Termos de Uso e Política de Privacidade dentro do app). Roda só quando pedido ("Run workflow").
name: tv-video
on:
  workflow_dispatch:
jobs:
  video:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Gerar o projeto
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Baixar pacotes
        run: xcodebuild -resolvePackageDependencies -project IPTVBestPro.xcodeproj -clonedSourcePackagesDirPath spm

      - name: Compilar Apple TV (simulador)
        run: |
          set -o pipefail
          xcodebuild build -project IPTVBestPro.xcodeproj -scheme IPTVBestProTV -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' -derivedDataPath dd -clonedSourcePackagesDirPath spm \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee tv-sim.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" tv-sim.log

      - name: Gravar o vídeo
        env:
          BP_TEST_CODE: ${{ secrets.BP_TEST_CODE }}
        run: |
          mkdir -p video
          CODE="${BP_TEST_CODE:-17107050}"
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; l=[x['udid'] for k,v in d.items() if 'tvOS' in k for x in v if 'Apple TV 4K' in x['name']]; print(l[0] if l else '')")
          echo "simulador: $UDID"
          [ -z "$UDID" ] && { echo "sem simulador de Apple TV"; exit 1; }
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          xcrun simctl install "$UDID" dd/Build/Products/Debug-appletvsimulator/IPTVBestProTV.app
          # liga o aparelho com o código de demonstração (uma vez) antes de gravar
          xcrun simctl launch "$UDID" com.iptvbestpro.app -bpTestCode "$CODE" -bpScreen home; sleep 25
          xcrun simctl terminate "$UDID" com.iptvbestpro.app || true
          cat > rec.py <<'EOF'
          import os, subprocess, sys, time
          udid, code = sys.argv[1], sys.argv[2]
          app = "com.iptvbestpro.app"
          os.makedirs("frames", exist_ok=True)
          n = 0
          def sh(*a): subprocess.run(["xcrun", "simctl", *a], check=False)
          def shot():
              global n
              sh("io", udid, "screenshot", "--type=jpeg", "frames/f%04d.jpg" % n)
              n += 1
          # o gravador de vídeo do simulador de Apple TV não gera arquivo: tira capturas em sequência e monta o vídeo com o ffmpeg
          for scr, wait in (("subscription", 24), ("terms", 22), ("privacy", 22)):
              sh("launch", udid, app, "-bpTestCode", code, "-bpScreen", scr)
              t0 = time.time()
              while time.time() - t0 < wait: shot()
              if scr == "privacy": sh("io", udid, "screenshot", "video/apple-tv-privacidade.png")
              sh("terminate", udid, app)
          print("capturas:", n)
          EOF
          python3 rec.py "$UDID" "$CODE"
          brew install ffmpeg
          ffmpeg -y -framerate 1 -i frames/f%04d.jpg -vf "scale=1920:-2,format=yuv420p" -c:v libx264 -movflags +faststart video/apple-tv-assinatura.mp4
          xcrun simctl terminate "$UDID" com.iptvbestpro.app || true
          xcrun simctl shutdown "$UDID" || true
          ls -la video

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-tv-video
          path: |
            video/*
            tv-sim.log
