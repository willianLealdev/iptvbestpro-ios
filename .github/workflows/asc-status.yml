# Consulta no App Store Connect a situação dos builds enviados (processando, válido, com problema, TestFlight)
name: asc-status
on:
  workflow_dispatch:
jobs:
  status:
    runs-on: ubuntu-latest
    env:
      ASC_KEY: ${{ secrets.ASC_KEY }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - run: pip install -q pyjwt cryptography requests
      - name: Builds
        shell: python
        run: |
          import os, time, jwt, requests
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 900, "aud": "appstoreconnect-v1"},
                           os.environ["ASC_KEY"], algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          H = {"Authorization": "Bearer " + tok}
          B = "https://api.appstoreconnect.apple.com/v1"
          apps = requests.get(B + "/apps?filter[bundleId]=com.iptvbestpro.app", headers=H).json()
          for a in apps.get("data", []):
              print("APP", a["id"], a["attributes"]["name"])
              r = requests.get(B + "/builds?filter[app]=" + a["id"] + "&limit=10&sort=-uploadedDate&include=preReleaseVersion,buildBetaDetail", headers=H).json()
              inc = {(i["type"], i["id"]): i for i in r.get("included", [])}
              for b in r.get("data", []):
                  at = b["attributes"]
                  pv = b["relationships"]["preReleaseVersion"]["data"]
                  plat = inc.get((pv["type"], pv["id"]), {}).get("attributes", {}).get("platform", "?") if pv else "?"
                  bd = b["relationships"]["buildBetaDetail"]["data"]
                  beta = inc.get((bd["type"], bd["id"]), {}).get("attributes", {}) if bd else {}
                  print(" BUILD", plat, at.get("version"), "estado:", at.get("processingState"), "| expirado:", at.get("expired"),
                        "| criptografia:", at.get("usesNonExemptEncryption"), "| interno:", beta.get("internalBuildState"), "| externo:", beta.get("externalBuildState"))
          if not apps.get("data"): print(apps)
